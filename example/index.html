<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuroglancer Mini</title>
  </head>
  <body>
    <div id="app">
      <main id="start" hidden>
        <div class="card">
          <h1>Neuroglancer Mini</h1>
          <p class="subtitle">View OME-Zarr volumes as cross-sections.</p>

          <button id="open-folder" class="primary" type="button">
            Open local folder
          </button>
          <p id="folder-note" class="note" hidden>
            Opening a local folder requires Chrome or Edge.
          </p>

          <div class="divider">or</div>

          <!-- Submitting reloads the page with ?zarr=<url>. -->
          <form class="url-form">
            <input
              name="zarr"
              type="url"
              required
              placeholder="https://example.com/volume.zarr"
              aria-label="Zarr URL"
            />
            <button type="submit">Open</button>
          </form>
          <p class="note">
            Try
            <a
              href="?zarr=https://dl.ash2txt.org/full-scrolls/Scroll1/PHercParis4.volpkg/volumes_zarr_standardized/54keV_7.91um_Scroll1A.zarr"
              >Scroll 1 from the Vesuvius Challenge</a
            >.
          </p>

          <footer>
            <span>OME-Zarr v2 · blosc or raw</span>
            <a href="https://github.com/tomhsiao1260/neuroglancer-mini">GitHub</a>
          </footer>
        </div>
      </main>

      <div id="status" hidden>
        <span class="spinner"></span>
        <span>Loading volume…</span>
      </div>

      <div id="hint" hidden>
        Drag to pan · Wheel to change slice · Ctrl + wheel to zoom
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
